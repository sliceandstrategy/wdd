<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreditCard</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico"> 
    <link rel="stylesheet" href="creditcard.css">
    <meta name="description" content="Securely submit your payment details through Blake Inc’s encrypted credit card form. Fast, private, and trusted processing.">
    <meta name="keywords" content="Credit Card Processing">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"> 
</head>
<body>
    <div id="card-success" class="hidden">
      <i class="fa fa-check"></i>
      <p>Payment Successful!</p>
    </div>
    <div id="form-errors" class="hidden">
      <i class="fa fa-exclamation-triangle"></i>
      <p id="card-error">Card error</p>
    </div>
    <div id="form-container">

      <div id="card-front">
        <div id="shadow"></div>
        <div id="image-container">
          <span id="amount">paying: <strong>$99</strong></span>
          <span id="card-image">

          </span>
        </div>

        <label for="card-number">
            Card Number
        </label>
        <input type="text" id="card-number" placeholder="1234 5678 9101 1112" maxlength="19">
        
        <div id="cardholder-container">
          <label for="card-holder">Card Holder</label>
          <input type="text" id="card-holder" placeholder="e.g. John Doe" />
        </div>
        
        <div id="exp-container">
          <label for="card-exp">
              Expiration
          </label>
          <input id="card-month" type="text" placeholder="MM" maxlength="2"> 
          <input id="card-year" type="text" placeholder="YY" maxlength="2"> 
        </div>
        
        <div id="cvc-container">
          <label for="card-cvc"> CVC/CVV</label>
          <input id="card-cvc" placeholder="XXX-X" type="text" minlength="3" maxlength="4"> 
          <p>Last 3 or 4 digits</p>
        </div>
      </div>
      
      <div id="card-back">
        <div id="card-stripe">
        </div>
      </div>
      
      <input type="text" id="card-token" /> 
      <button type="button" id="card-btn">Submit</button>

    </div>


    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>
    <script type="text/javascript" src="https://js.stripe.com/v2/"></script>
    <script src="https://use.fontawesome.com/f1e0bf0cbc.js"></script>
    <script src="creditcard.js"></script> 
</body>
</html>
